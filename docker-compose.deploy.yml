version: "3.8"

services:
  # ==========================================
  # DATABASE SERVICE (PostgreSQL 15)
  # ==========================================
  muter_postgres:
    image: postgres:15-alpine
    container_name: muter-muter-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-muter_muter_prod}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - muter_net
    mem_limit: 384m
    mem_reservation: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-muter_muter_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # APPLICATION SERVICE (Laravel + FrankenPHP)
  # ==========================================
  muter_muter_app:
    image: ${TARGET_IMAGE:-ghcr.io/khensin166/muter-muter-app:latest}
    container_name: muter-muter-app
    restart: always
    depends_on:
      muter_postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8282}:8000"
    env_file:
      - .env
    networks:
      - muter_net
    mem_limit: 640m
    mem_reservation: 256m
    cpus: 1.0
    volumes:
      - ./storage/public:/app/storage/app/public
      - ./storage/logs:/app/storage/logs

networks:
  muter_net:
    external: true
